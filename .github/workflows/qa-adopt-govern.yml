name: qa-adopt-govern
run-name: ${{ inputs.helio_execution_id || format('QA lane GitHub-started governed run {0}', github.sha) }}
# QA lane qa-lane-20261026 (26 Oct 2026): the GitHub-started workflow for the "Govern existing environment
# promotions" policy (TC-298, second pipeline). QA pushes a file under qa-govern/ on main; GitHub starts the run and
# waits at qa-test, then qa-prod, for Helio's reviewer (the QA reviewer connection); Helio adopts the run and its
# gates are signed in Helio. Nothing is deployed.
on:
  push:
    branches: [main]
    paths: ['.github/workflows/qa-adopt-govern.yml', 'qa-govern/**']
  workflow_dispatch:
    inputs:
      environment: { type: string, required: false, default: '' }
      helio_execution_id: { type: string, required: false, default: '' }
      helio_release_id: { type: string, required: false, default: '' }
      workflow_revision: { type: string, required: false, default: '' }
      release_version: { type: string, required: false, default: '' }
permissions:
  contents: read
  deployments: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Build (synthetic)
        shell: bash
        run: |
          echo "QA lane GitHub-started governed build of ${GITHUB_SHA}; nothing is built."
          sleep 15
  qa-test:
    name: deploy qa-test
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: qa-test
    steps:
      - name: Deploy to qa-test (synthetic)
        shell: bash
        run: |
          echo "QA lane GitHub-started synthetic deployment of ${GITHUB_SHA} to qa-test; no application is deployed."
          sleep 15
  qa-prod:
    name: deploy qa-prod
    needs: qa-test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: qa-prod
    steps:
      - name: Deploy to qa-prod (synthetic)
        shell: bash
        run: |
          echo "QA lane GitHub-started synthetic deployment of ${GITHUB_SHA} to qa-prod; no application is deployed."
          sleep 15
